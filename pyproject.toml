[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maya-mcp"
version = "0.1.0"
description = "MCP server that lets Claude, Codex and other MCP clients inspect and control Autodesk Maya"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
maya-mcp = "maya_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maya_mcp"]
